#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1600
max_height    = 1600
image_delay   = 15
image_filter  = "lanczos3"
image_quality = 90

[opener]
vlc = [
	{ run = 'vlc %s', orphan = true, desc = "VLC Media Player", for = "linux" },
]
qbittorrent = [
	{ run = 'qbittorrent %s', orphan = true, desc = "qBittorrent", for = "linux" },
]

[open]
prepend_rules = [
	# Media (Audio & Video) -> VLC
	{ mime = "video/*", use = "vlc" },
	{ mime = "audio/*", use = "vlc" },
	{ url = "*.m3u*", use = "vlc" },

	# Torrents -> qBittorrent
	{ mime = "application/x-bittorrent", use = "qbittorrent" },
	{ url = "*.torrent", use = "qbittorrent" },
]
